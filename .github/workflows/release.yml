name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Package Windows application
        shell: powershell
        run: .\Windows\package.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v7
        with:
          name: NJC-AI-Monitor-Windows-${{ matrix.runtime }}
          path: Windows/dist/NJC-AI-Monitor-Windows-${{ matrix.runtime }}.zip

  release:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v8
        with:
          pattern: NJC-AI-Monitor-Windows-*
          path: release-files
          merge-multiple: true

      - name: Generate checksums and release notes
        shell: bash
        run: |
          sha256sum release-files/*.zip > release-files/SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          ## Install

          Download the ZIP matching your architecture. Most Windows PCs use `win-x64`.
          Extract the complete folder, then run `NJC AI Monitor.exe`.

          ## v0.3.0 highlights

          - Grok Bot session detection, completion alerts, and local weekly quota support
          - Configurable AI Quota panel with up to two primary gauges and optional progress rows
          - Five-minute `Waiting for You` display window while unacknowledged completions remain persistent
          - Improved Grok completion detection based on local queue and transcript-cache activity
          - Updated English and Chinese documentation plus refreshed previews for all five themes

          ## Requirements

          - Windows 10 1809 or newer; Windows 11 is recommended
          - Thermalright Trofeo Vision 11.3 LCD (1920×400)
          - Exit the official TRCC application before using the LCD
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-files/*.zip \
            release-files/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --generate-notes
